<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="favGofyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E84393" />
      <stop offset="100%" stop-color="#FD79A8" />
    </linearGradient>
    <linearGradient id="favKidsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CEC9" />
      <stop offset="100%" stop-color="#81ECEC" />
    </linearGradient>
    <linearGradient id="favWarmAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" />
      <stop offset="100%" stop-color="#FECA57" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="120" height="120" rx="28" fill="#FFF0F5" />
  
  <!-- Centered Hanger Motif -->
  <g transform="translate(10, 8)">
    <!-- Hanger Hook -->
    <path d="M 50 25 C 50 16, 38 16, 38 25 C 38 34, 50 37, 50 45" 
          fill="none" stroke="#E84393" stroke-width="5.5" stroke-linecap="round" />
    
    <!-- Hanger Body with Soft Curve -->
    <path d="M 16 73 L 50 46 L 84 73 C 88 76, 84 82, 78 82 L 22 82 C 16 82, 12 76, 16 73 Z" 
          fill="url(#favGofyGrad)" />
    
    <!-- Cutout Bar underneath -->
    <line x1="26" y1="82" x2="74" y2="82" stroke="#D63031" stroke-width="2.5" opacity="0.35" />

    <!-- Cute Smiling Cloud / Baby motif inside hanger -->
    <circle cx="50" cy="65" r="7.5" fill="#FFFFFF" />
    
    <!-- Floating playful heart (Women's touch) -->
    <path d="M 76 34 C 76 27, 68 23, 64 28 C 60 23, 52 27, 52 34 C 52 43, 64 50, 64 50 C 64 50, 76 43, 76 34 Z" 
          fill="url(#favWarmAccent)" transform="scale(0.68) translate(32, -6)" />

    <!-- Playful star (Kids' touch) -->
    <path d="M 91 75 Q 93 78 96 79 Q 93 80 91 83 Q 89 80 86 79 Q 89 78 91 75 Z" 
          fill="url(#favKidsGrad)" transform="scale(1.2) translate(-6, -4)" />
  </g>
</svg>
